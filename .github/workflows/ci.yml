name: CI

# Command Governor is a Prime/Pi package distribution. CI gates the assembled
# harness and the real pinned-Prime conformance surface; the superseded Rust
# control-plane oracle was retired when ADR 0010 made composition-first ownership
# the active repository architecture.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify component manifest and install pinned substrate
        run: scripts/bootstrap.sh
      - name: Typecheck and conformance
        run: scripts/conformance.sh
      - name: No Prime processes survive the job
        if: always()
        run: |
          set -eu
          leftovers=$(ps -axo pid=,command= | awk '/prime-agent/ && !/awk/ { print }' || true)
          if [ -n "$leftovers" ]; then
            echo "$leftovers"
            echo "::error::Prime processes survived the conformance run"
            exit 1
          fi
          echo "no prime-agent processes"
