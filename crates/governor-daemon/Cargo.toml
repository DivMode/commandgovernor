[package]
name = "governor-daemon"
version = "0.0.0"
description = "Composition library wiring the Command Governor kernel to its store."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
governor-core.workspace = true
governor-store-sqlite.workspace = true
governor-artifacts.workspace = true

thiserror.workspace = true

# The production `IdSource`: UUIDv7 minting needs a clock and entropy, which is
# why `governor-core` depends on the type only and the `v7` feature is enabled
# here (crates/governor-core/src/id.rs, "Generation is a port").
uuid = { workspace = true, features = ["v7"] }

# The production `SecureRandom` and the process-start identity hash.
getrandom.workspace = true
sha2.workspace = true

# Clean shutdown on `SIGINT`/`SIGTERM`.
signal-hook.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
