# cargo-deny policy for Command Governor.
#
# Backs the supply-chain mitigations in docs/threat-model.md ("Threat:
# supply-chain compromise") and the quality gates in
# docs/adr/0002-rust-daemon-and-sqlite.md. Run with `cargo deny check`.

[graph]
all-features = true

[output]
feature-depth = 1

# --- Advisories -------------------------------------------------------------
# Any RUSTSEC advisory against a crate in the graph fails the build. Silencing
# one requires an explicit, reviewed entry in `ignore` with a reason; there are
# none, and a new one is a review decision rather than an implementation detail.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

# --- Licenses ---------------------------------------------------------------
# Command Governor ships under MIT. Only permissive licences that can be
# redistributed under those terms are allowed; anything copyleft or unlisted
# fails and must be reviewed before it enters the graph.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = []
# The allowlist is a policy statement, not an inventory. Allowing a licence no
# current dependency happens to use is not a finding.
unused-allowed-license = "allow"

[licenses.private]
# Workspace members are `publish = false` and carry no third-party obligation.
ignore = true

# --- Bans -------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Known-malicious August 2026 crates.io releases, named in docs/threat-model.md.
# These are exact-version bans: the crate names themselves are legitimate, and
# only the compromised releases are refused.
deny = [
    { crate = "arrayref@=0.3.10", reason = "malicious release, August 2026 crates.io compromise (docs/threat-model.md)" },
    { crate = "internment@=0.8.7", reason = "malicious release, August 2026 crates.io compromise (docs/threat-model.md)" },
    { crate = "append-only-vec@=0.1.9", reason = "malicious release, August 2026 crates.io compromise (docs/threat-model.md)" },
]

# --- Sources ----------------------------------------------------------------
# crates.io only. A git or alternate-registry dependency bypasses the audit and
# licence policy above, so it must be a deliberate, reviewed change to this file.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
